<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <title>Nayaab Engineering Innovations Pvt. Ltd.</title>

    <!-- Referrer & Browser Security -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Content Security Policy (Updated with media-src for R2 Video Streaming) -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com data:;
        img-src 'self' data: blob: https:;
        media-src 'self' blob: https://*.r2.dev https:;
        connect-src 'self' https://*.supabase.co https://*.r2.dev https:;
        frame-src 'none';
        object-src 'none';
      "
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
